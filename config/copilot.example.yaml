# Copilot — configuración de ejemplo.
#
# Este archivo está pensado para vivir en el repo de infraestructura del cliente,
# revisado por PR. Por eso no lleva un solo secreto: cualquier valor se puede
# escribir como ${VAR} o ${VAR:-default} y se resuelve contra el entorno al
# arrancar. Un ${VAR} sin valor y sin default corta el arranque con el nombre del
# campo — mejor eso que un 401 raro tres horas después.

server:
  host: 0.0.0.0
  port: 8080
  # Token compartido para /v1/*. Las rutas de salud quedan afuera a propósito:
  # si el kubelet tuviera que autenticarse para preguntar si el pod vive, un
  # token mal puesto se vería como un CrashLoop sin explicación.
  api_token: ${COPILOT_API_TOKEN}

# --- Métricas: el único puerto obligatorio ----------------------------------
# El mismo adapter sirve para Prometheus, Thanos Query, Mimir, VictoriaMetrics,
# Grafana Cloud y AMP: todos hablan la HTTP API v1.
metrics:
  adapter: prometheus
  url: ${PROMETHEUS_URL:-http://prometheus:9090}
  # auth:
  #   type: bearer          # none | bearer | basic
  #   token: ${PROM_TOKEN}
  # headers:                # para lo que no entra en los tres de arriba
  #   X-Scope-OrgID: tenant-a     # Mimir/Cortex multi-tenant
  # verify_tls: true

# Si las métricas están en Cloud Eye y no en un Prometheus. No habla PromQL:
# `query` es un selector NAMESPACE/metric{dim="valor"} y el agente lo aprende
# del prompt. Necesita `pip install observability-copilot[huawei]` o la imagen con
# --build-arg EXTRAS=huawei. Permisos: ces:metricData:list, ces:metrics:list,
# ces:alarms:list — lectura, nada más.
# metrics:
#   adapter: cloudeye
#   region: la-south-2
#   ak: ${HW_AK}
#   sk: ${HW_SK}
#   # project_id: ...       # si no, el SDK lo resuelve por la región

# --- Presupuesto de consulta ------------------------------------------------
# Esto no es una preferencia: es lo único que separa "el agente consulta las
# métricas" de "el agente le tira abajo el Prometheus de producción". El step de
# un range lo calcula el adapter respetando max_points; lo que pase max_series
# se descarta y el resultado sale marcado como parcial.
budget:
  max_series: 500
  max_points: 11000
  max_range: 31d
  timeout: 30s

# --- Costos: opcional, y se lee de donde ya esté ----------------------------
# El adapter por defecto NO va a una API de facturación: corre PromQL contra la
# misma TSDB de arriba. Si el cliente ya exporta su gasto (kubecost, opencost, un
# exporter de billing, un recording rule), el dato ya está en casa — responde en
# milisegundos, no pide credenciales nuevas y no tiene rate limit.
# Las expresiones las escribe el cliente, así que sirve con cualquier nube.
cost:
  adapter: promql
  daily: 'sum(increase(cloud_cost_usd_total[1d]))'
  by_service: 'sum by (service) (increase(cloud_cost_usd_total[1d]))'
  by_resource: 'sum by (resource_id) (increase(cloud_cost_usd_total[1d]))'
  currency: USD
  # Con cuánto atraso llega el dato. Sirve para no gritar por el día que todavía
  # se está llenando, que es la falsa alarma más común de FinOps.
  lag_days: 0

# Si el gasto NO está en la TSDB: la API de facturación de Huawei (BSS). Va un
# día atrás (lag_days: 1), es global (la credencial no es por proyecto) y sólo
# necesita bss:bill:list. `edition: cn` para la nube de China.
# cost:
#   adapter: huawei_bss
#   ak: ${HW_AK}
#   sk: ${HW_SK}
#   edition: intl
#   lag_days: 1

# --- Modelo: por defecto, el del cliente ------------------------------------
# Apuntalo a lo que ya tenga puesto: vLLM, Ollama, TGI, LiteLLM, MaaS, Azure
# OpenAI o su gateway. Que los datos no salgan de su red es lo que hace que esto
# se pueda instalar sin un proceso de aprobación de tres meses.
model:
  adapter: openai_compat
  base_url: ${MODEL_BASE_URL}
  api_key: ${MODEL_API_KEY:-}
  model: ${MODEL_NAME:-qwen2.5-32b-instruct}
  timeout_s: 120
  # require_https: true   # prendelo en producción

# --- Notificaciones ---------------------------------------------------------
# Un canal es tonto: recibe y entrega. El dedup, las quiet hours y el tope
# diario NO viven en el canal: van en `dispatch`, iguales para todos, porque lo
# que te desinstala no es un bug del adapter de Slack, es mandar 200 SMS una
# madrugada. Slack con bloques, Teams y mail son de F3.
notify:
  - name: ops
    adapter: log
  # - name: slack
  #   adapter: webhook
  #   url: ${SLACK_WEBHOOK_URL}
  #   template: slack
  # SMN de Huawei: un topic, y atrás lo que el cliente haya suscripto (SMS,
  # mail, HTTP). Necesita `pip install observability-copilot[huawei]` o la imagen
  # construida con --build-arg EXTRAS=huawei.
  # - name: guardia
  #   adapter: smn
  #   region: la-south-2
  #   topic_urn: ${SMN_TOPIC_URN}
  #   ak: ${HW_AK}
  #   sk: ${HW_SK}
  #   max_chars: 400        # un SMS recorta a ~490 bytes; con sólo mail, subilo

# La política de entrega. Una para todos los canales.
dispatch:
  # El mismo aviso (mismo fingerprint) no se repite antes de esto.
  repeat_interval: 4h
  # Lo que no es crítico espera a que termine la ventana. Lo crítico pasa.
  # quiet_hours:
  #   start: "22:00"
  #   end: "07:00"
  #   tz: America/Argentina/Buenos_Aires
  # Por canal y por día. Al llegar, sale UN aviso más y después nada hasta mañana.
  daily_cap: 50

# --- Alertas que llegan de Alertmanager ------------------------------------
# El receiver es POST /v1/alerts con el token en `authorization.credentials`.
# Lo que llega se decide primero (dedup, quiet hours, tope), y sólo lo que va
# a salir se enriquece: la expresión de la regla, su tendencia, cuántas otras
# hay activas, el gasto, y —con `triage`— seis líneas del modelo con hipótesis
# y qué mirar. Un turno del agente por alerta: es lo que cuesta.
alerts:
  triage: true
  lookback: 1h            # cuánto antes del disparo se mira la expresión
  max_concurrent: 2       # enriquecimientos a la vez
  queue_max: 200          # más que esto en vuelo y se descarta con aviso

# --- Persistencia: tres archivos, no una base --------------------------------
# Auditoría (qué se consultó), alertas recibidas (qué sonó y qué se dijo) y el
# estado del despachante (a quién se le avisó y cuántas veces hoy). Lo último
# es lo que importa: sin esto, un reinicio a las 3 AM olvida el dedup y el tope
# diario, y lo primero que hace el proceso nuevo es re-mandar todo. Vacío =
# memoria sola, y /v1/status lo dice (`storage.durable: false`).
storage:
  path: ${COPILOT_STORAGE_PATH:-}     # p.ej. /var/lib/copilot, en un volumen

# --- Detectores: lo que corre solo y avisa ---------------------------------
# El LLM no participa: un número que dispara un SMS a las 4 de la mañana se
# calcula en código, se testea y se explica en una línea.
detectors:
  cost_spike:
    enabled: false          # pide el bloque `cost` de arriba
    interval: 1h
    window_days: 14         # la ventana del baseline
    threshold: 1.5          # último día completo / mediana de la ventana
    min_amount: 0           # piso en la moneda del costo: pasar de 2 a 6 no le importa a nadie
    min_days: 5             # con menos días con dato no hay baseline y no se opina

# --- Agente -----------------------------------------------------------------
agent:
  max_steps: 12
  max_seconds: 180s
  temperature: 0.2
  # system_prompt: |
  #   Sobreescribe el de fábrica. Sólo si sabés lo que estás haciendo: el default
  #   insiste en descubrir el esquema antes de escribir queries, que es lo que
  #   evita que el modelo invente nombres de métricas.
