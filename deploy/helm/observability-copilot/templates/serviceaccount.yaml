{{- if .Values.serviceAccount.create }}
# El copiloto no habla con la API de Kubernetes: no necesita token de SA.
# Se crea la cuenta igual para que las policies y los audit logs tengan un
# nombre propio, y se le apaga el automount.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "copilot.serviceAccountName" . }}
  labels: {{- include "copilot.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
