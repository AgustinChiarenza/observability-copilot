[project]
name = "pcnt-copilot"
version = "0.1.0"
description = "Addon de observabilidad: lee las métricas, alertas y costos que el cliente ya tiene."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "httpx>=0.28,<1",
    "pydantic>=2.10,<3",
    "PyYAML>=6,<7",
    "prometheus-client>=0.21,<1",
]

[project.optional-dependencies]
# Sólo para el canal notify/smn. Un cliente sin Huawei no lo instala.
huawei = [
    "huaweicloudsdksmn>=3.1,<4",
    "huaweicloudsdkces>=3.1,<4",
    "huaweicloudsdkbssintl>=3.1,<4",
]
dev = [
    # Para testear los adapters de Huawei con clientes falsos.
    "huaweicloudsdksmn>=3.1,<4",
    "huaweicloudsdkces>=3.1,<4",
    "huaweicloudsdkbssintl>=3.1,<4",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[project.scripts]
copilot = "copilot.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["copilot*"]
